name: 🐛 Hata Bildirimi (Bug Report)
description: Sistemde beklenmeyen bir hata veya bozuk işlev bildirin.
title: "[HATA]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Afyon Beykoz SK sistemlerinde tespit ettiğiniz teknik hataları bildirmek için lütfen bu formu eksiksiz doldurunuz.
  - type: textarea
    id: description
    attributes:
      label: Hatanın Açıklaması
      description: Karşılaştığınız hatayı net ve anlaşılır bir şekilde tarif edin.
      placeholder: Hangi işlem sırasında, nasıl bir hata ile karşılaştınız?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yeniden Üretme Adımları
      description: Hatanın tekrarlanabilmesi için izlenen adımları listeleyin.
      placeholder: |
        1. '...' sayfasına gidin
        2. '...' butonuna tıklayın
        3. '...' hatası görüntülendi
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen Davranış
      description: Normal şartlarda sistemin nasıl tepki vermesi gerekiyordu?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Etkilenen Bileşen
      options:
        - Yönetim Paneli (Admin UI)
        - Web Arayüzü (Public Frontend)
        - Backend API & Sunucu
        - Veritabanı / Migration
        - Bildirim / E-Posta Servisi
        - Diğer
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Ekran Görüntüsü / Log Kayıtları
      description: Varsa konsol hataları veya ekran görüntülerini buraya ekleyin.
